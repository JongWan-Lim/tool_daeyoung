  :root{
    --base:#E8EBEA;      /* 아연 회백: 기본 배경 */
    --paper:#F5F7F6;     /* 번갈아 쓰는 밝은 배경 */

    --ink-soft:#4A5459;  /* 보조 글자 */

    --rule:#B9C0BF;      /* 구분선 */

    --r:2px;
    --max-w:1080px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} }
  body{
    margin:0;
    font-family:var(--body);
    font-size:16px;
    color:var(--ink);
    background:var(--base);
    line-height:1.7;
    word-break:keep-all;
    overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--sign);outline-offset:3px;}
  .on-sign :focus-visible, footer :focus-visible{outline-color:var(--safety);}
  .wrap{max-width:var(--max-w);margin:0 auto;padding:0 20px;}
  section{padding:72px 0;}
  h1,h2,h3{margin:0;}
  h2{
    font-family:var(--head);font-weight:400;
    font-size:clamp(26px,4vw,34px);line-height:1.3;margin-bottom:14px;
  }
  .section-desc{color:var(--ink-soft);max-width:34em;margin:0 0 36px;}
  .alt{background:var(--paper);}

  /* ---------- 버튼 ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 20px;border-radius:var(--r);
    font-weight:700;font-size:15px;line-height:1.2;
    text-decoration:none;border:2px solid transparent;
  }
  .btn svg{width:18px;height:18px;flex:none;}
  .btn-call{background:var(--safety);color:var(--ink);}
  .btn-call:hover{background:#FFD22E;}
  .btn-sign{background:var(--sign);color:#fff;}
  .btn-sign:hover{background:var(--sign-dark);}
  .btn-ghost{border-color:rgba(255,255,255,.55);color:#fff;}
  .btn-ghost:hover{border-color:#fff;}

  /* ---------- 헤더 ---------- */
  header{
    position:sticky;top:0;z-index:50;

  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end;}

<a class="float-call" id="float-call" href="tel:01000000000" aria-label="전화 걸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>

<div id="gallery-modal" class="gallery-modal" hidden>
  <div class="gallery-modal-backdrop" data-close="1"></div>
  <div class="gallery-modal-box" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title">
    <button type="button" class="gallery-modal-close" aria-label="닫기">✕</button>
    <h3 id="gallery-modal-title"></h3>
    <div class="gallery-modal-grid" id="gallery-modal-grid"></div>
  </div>
</div>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=ifngxdc762&submodules=geocoder"></script>

<script>
  // CONFIG 값을 실제 화면에 채워 넣는 부분입니다. 보통은 이 아래 스크립트를 건드릴 필요가 없습니다.
  const telHref = "tel:" + CONFIG.phone.replace(/[^0-9+]/g, "");

  document.getElementById("brand-name").textContent = CONFIG.storeName;
  document.getElementById("hero-name").innerHTML =
    (CONFIG.storeNameLines && CONFIG.storeNameLines.length ? CONFIG.storeNameLines : [CONFIG.storeName]).join("<br>");
  document.getElementById("hero-tagline").textContent = CONFIG.tagline;
  document.getElementById("hero-phone-text").textContent = CONFIG.phoneDisplay;
  document.getElementById("visit-address").textContent = CONFIG.address;
  document.getElementById("footer-address").textContent = CONFIG.address;
  document.getElementById("footer-name").textContent = "© " + new Date().getFullYear() + " " + CONFIG.storeName;

  document.getElementById("visit-phone").textContent = CONFIG.phoneDisplay;
  document.getElementById("footer-phone").textContent = CONFIG.phoneDisplay;

  [ "header-call", "hero-call", "visit-phone", "float-call" ].forEach(id => {
    document.getElementById(id).setAttribute("href", telHref);
  });

  document.getElementById("hero-map").setAttribute("href", CONFIG.naverMapUrl);
  document.getElementById("visit-map").setAttribute("href", CONFIG.naverMapUrl);

  // 서비스 타일: icon 값은 아래 SERVICE_ICONS 의 키입니다.
  const SERVICE_ICONS = {
    wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
    droplet: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
    zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    roller: '<rect width="16" height="6" x="2" y="2" rx="2"/><path d="M10 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect width="4" height="6" x="8" y="16" rx="1"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  };
  document.getElementById("service-grid").innerHTML = CONFIG.services.map(s => `
    <div class="service-tile">
      <svg viewBox="0 0 24 24" aria-hidden="true">${SERVICE_ICONS[s.icon] || ""}</svg>
      <h3>${s.name}</h3>
    </div>
  `).join("");

  // 상품 카드: 품목마다 gallery 배열(사진 여러 장)을 넣으면
  // 대표 사진(첫 장)이 카드에 뜨고, 클릭하면 그 품목의 사진들을 그리드로 모아 보여줍니다.
  // 사진이 없는 품목은 "사진 준비 중" 빗금 박스가 나옵니다.
  document.getElementById("product-grid").innerHTML = CONFIG.products.map((p, i) => {
    var photos = p.gallery && p.gallery.length ? p.gallery : null;
    var clickable = photos ? `data-gallery-index="${i}" role="button" tabindex="0"` : "";
    var media = photos
      ? `<div class="product-photo-wrap">
          <img class="product-photo" src="${photos[0]}" alt="${p.name}">
          <span class="photo-tag">${photos.length > 1 ? "+" + (photos.length - 1) + "장 더보기" : "사진 보기"}</span>
        </div>`
      : `<div class="product-photo-wrap">사진 준비 중</div>`;
    return `
    <div class="product" ${clickable}>
      ${media}
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
    </div>
  `;
  }).join("");

  // 카드 클릭/키보드(enter, space) -> 그 품목의 사진 갤러리 모달 열기
  function openGallery(index) {
    var p = CONFIG.products[index];
    if (!p || !p.gallery || !p.gallery.length) return;
    document.getElementById("gallery-modal-title").textContent = p.name;
    document.getElementById("gallery-modal-grid").innerHTML = p.gallery.map(src => `
      <a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${p.name}"></a>
    `).join("");
    document.getElementById("gallery-modal").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeGallery() {
    document.getElementById("gallery-modal").hidden = true;
    document.body.style.overflow = "";
  }
  document.querySelectorAll('.product[data-gallery-index]').forEach(function (card) {
    card.addEventListener("click", function () {
      openGallery(Number(card.dataset.galleryIndex));
    });
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openGallery(Number(card.dataset.galleryIndex));
      }
    });
  });
  document.getElementById("gallery-modal").addEventListener("click", function (e) {
    if (e.target.dataset.close || e.target.classList.contains("gallery-modal-close")) closeGallery();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeGallery();
  });

  document.getElementById("extra-grid").innerHTML = CONFIG.extras.map(e => `
    <div class="extra-item">
      <span class="extra-label">${e.label}</span>
      <span class="extra-text">${e.text}</span>
    </div>
  `).join("");

  document.getElementById("hours-table").innerHTML = CONFIG.hours.map(h => `
    <tr><td>${h.day}</td><td>${h.time}</td></tr>
  `).join("");

  // 네이버 지도: CONFIG.address를 좌표로 변환해서 지도에 표시
  if (window.naver && naver.maps) {
    var naverMapEl = document.getElementById("naver-map");
    if (naverMapEl) {
      var naverMap = new naver.maps.Map(naverMapEl, {
        center: new naver.maps.LatLng(37.5665, 126.9780), // geocoding 성공 전 임시 중심(서울시청)
        zoom: 16,
      });
      naver.maps.Service.geocode({ query: CONFIG.address }, function (status, response) {
        if (status !== naver.maps.Service.Status.OK || !response.v2.addresses.length) {
          naverMapEl.innerHTML = "<div style=\"color:#4A5459;font-size:14px;padding:20px;text-align:center;\">지도를 불러오지 못했습니다. 주소를 확인해주세요.</div>";
          return;
        }
        var item = response.v2.addresses[0];
        var coords = new naver.maps.LatLng(item.y, item.x);
        naverMap.setCenter(coords);

        var marker = new naver.maps.Marker({ position: coords, map: naverMap, title: CONFIG.storeName });

        // 마커 위에 상호명 라벨을 붙이고, 클릭하면 네이버 지도(플레이스)로 이동
        var infoWindow = new naver.maps.InfoWindow({
          content:
            '<a href="' + CONFIG.naverMapUrl + '" target="_blank" rel="noopener" ' +
            'style="display:inline-block;padding:7px 12px;font-size:13px;font-weight:700;' +
            'color:#1E2326;text-decoration:none;white-space:nowrap;">' +
            CONFIG.storeName + '</a>',
          borderWidth: 0,
          backgroundColor: "transparent",
          disableAnchor: true,
          pixelOffset: new naver.maps.Point(0, -8),
        });
        infoWindow.open(naverMap, marker);

        naver.maps.Event.addListener(marker, "click", function () {
          window.open(CONFIG.naverMapUrl, "_blank", "noopener");
        });
      });
    }
  }
</script>

</body>
</html>
